{{extends "_baselayout.html"}}

{{block "body"}}
<div class="uk-card uk-card-default uk-card-body uk-width-1-2@m uk-margin-top uk-text-center">
    <h1 class="uk-text-danger">{{:status}}</h1>
    <h2 class="uk-heading-divider">{{:statustext}}</h2>
    <p class="uk-text-muted">We could not process that request.</p>
    {{if error}}
    <pre class="uk-text-left uk-background-muted uk-padding-small">{{:error}}</pre>
    {{endif}}
    <a class="uk-button uk-button-primary uk-margin-top" href="/">Back to the list</a>
    <p class="uk-text-muted uk-margin-small uk-clearfix">{{:app_name}} · {{:dmvc_version}} · {{:current_year}}</p>
</div>
{{endblock}}
